<!doctype html>
<html lang="es" class="auth-checking">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutriAGVR — Iniciar sesión</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Ccircle cx=%2720%27 cy=%2720%27 r=%2719%27 fill=%27%23E1EFDF%27/%3E%3Cpath d=%27M20 30C13 30 9 25.5 9 19c0-4 2-7 4-9 1.3 3 3.3 4.6 5.7 5.4C17.6 12 18.6 9 21 7c1.2 4 3.4 6 5.6 7.6C29.4 16.6 31 19 31 22c0 5-4.5 8-11 8Z%27 fill=%27%232E7D4F%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="shell">
    <section class="auth-wrap">
      <div class="auth-card">
        <div class="brand">
          <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <circle cx="20" cy="20" r="19" fill="var(--accent-soft)"/>
            <path d="M20 30C13 30 9 25.5 9 19c0-4 2-7 4-9 1.3 3 3.3 4.6 5.7 5.4C17.6 12 18.6 9 21 7c1.2 4 3.4 6 5.6 7.6C29.4 16.6 31 19 31 22c0 5-4.5 8-11 8Z" fill="var(--accent)"/>
            <path d="M20 30c0-6 1.5-13 6.6-18.4" stroke="var(--surface)" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <span class="wordmark">Nutri<span class="x">-AGVR</span></span>
        </div>
        <h2>Iniciar sesión</h2>
        <p class="auth-sub">Sistema de seguimiento nutricional</p>

        <div id="login-alert"></div>

        <form id="form-login" novalidate>
          <div class="field">
            <label for="login-username">Usuario</label>
            <input id="login-username" name="username" type="text" autocomplete="username" placeholder="p. ej. demo">
          </div>
          <div class="field">
            <label for="login-password">Contraseña</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        </form>

        <p class="switch-row">
          ¿No tienes cuenta? <a class="btn-link" href="registro.html" style="text-decoration:underline;">Crear usuario</a>
        </p>
        <p class="switch-row" style="margin-top:8px; font-size:0.78rem;">Cuenta de ejemplo: <span class="mono">demo</span> / <span class="mono">demo123</span></p>
      </div>
    </section>
  </div>

  <script type="module" src="js/pantallas/login.js"></script>
</body>
</html>

<!doctype html>
<html lang="es" class="auth-checking">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutriAGVR — Pacientes</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Ccircle cx=%2720%27 cy=%2720%27 r=%2719%27 fill=%27%23E1EFDF%27/%3E%3Cpath d=%27M20 30C13 30 9 25.5 9 19c0-4 2-7 4-9 1.3 3 3.3 4.6 5.7 5.4C17.6 12 18.6 9 21 7c1.2 4 3.4 6 5.6 7.6C29.4 16.6 31 19 31 22c0 5-4.5 8-11 8Z%27 fill=%27%232E7D4F%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="shell">
    <div id="navbar"></div>

    <div class="card">
      <div class="card-head">
        <div>
          <h3 id="form-paciente-titulo">Nuevo paciente</h3>
          <p class="hint" style="margin:0;">Captura nombre, edad, altura y peso para calcular su IMC.</p>
        </div>
      </div>

      <div id="paciente-alert"></div>

      <form id="form-paciente" novalidate>
        <div class="field-row">
          <div class="field" style="grid-column: 1 / -1;">
            <label for="p-nombre">Nombre completo</label>
            <input id="p-nombre" type="text" placeholder="Nombre del paciente">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="p-edad">Edad (años)</label>
            <input id="p-edad" type="number" inputmode="numeric" step="1" min="1" max="120">
          </div>
          <div class="field">
            <label for="p-altura">Altura (cm)</label>
            <input id="p-altura" type="number" inputmode="decimal" step="0.1" min="50" max="250">
          </div>
        </div>
        <div class="field">
          <label for="p-peso">Peso (kg)</label>
          <input id="p-peso" type="number" inputmode="decimal" step="0.1" min="1" max="400">
        </div>
        <div style="display:flex; gap:10px;">
          <button type="submit" class="btn btn-primary" id="btn-guardar-paciente">Registrar paciente</button>
          <button type="button" class="btn btn-ghost" id="btn-cancelar-edicion" hidden>Cancelar</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h3>Pacientes e informe de IMC</h3>
      <p class="hint">Peso, altura, edad e informe nutricional de cada paciente.</p>
      <div class="patients-grid" id="patients-grid"></div>
    </div>

    <footer class="foot">NutriAGVR &mdash; el informe de IMC es orientativo y no sustituye a un profesional de la salud.</footer>
  </div>

  <script type="module" src="js/pantallas/pacientes.js"></script>
</body>
</html>
